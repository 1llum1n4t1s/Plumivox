name: Build distribution artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ (github.repository == '1llum1n4t1s/Plumivox' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
          - os: ubuntu-24.04
            target: vps-linux-x86_64
          - os: ubuntu-24.04-arm
            target: vps-linux-aarch64
    runs-on: ${{ fromJSON(startsWith(matrix.os, 'windows-') && format('["{0}"]', matrix.os) || startsWith(matrix.os, 'macos-') && '["self-hosted","macOS","ARM64","m3mb14"]' || endsWith(matrix.os, '-arm') && '["self-hosted","Linux","ARM64","m3mb14"]' || '["self-hosted","Linux","X64","m3mb14"]') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_COMMIT: ${{ github.sha }}
      ARTIFACT_RUN: ${{ github.run_id }}
      ARTIFACT_ATTEMPT: ${{ github.run_attempt }}
      ARTIFACT_TARGET: ${{ matrix.target }}
    steps:
      # checkout前はrunner付属stable rustcだけを使用し、以降はrust-toolchain.tomlへ従う。
      - name: Compile native checkout bootstrap
        shell: rustc +stable --edition=2021 --crate-name plumivox_ci_bootstrap -o plumivox-ci-bootstrap.exe {0}
        run: |
          use std::{env, error::Error, fs, process::Command};
          type Result = std::result::Result<(), Box<dyn Error>>;
          fn run(args: &[&str]) -> Result {
              if !Command::new("git").args(args).status()?.success() {
                  return Err("Git checkout failed".into());
              }
              Ok(())
          }
          fn main() -> Result {
              let script = fs::read_to_string(env::args().nth(1).ok_or("Missing command")?)?;
              if script.trim() != "checkout" { return Err("Invalid bootstrap command".into()); }
              if env::var("CHECK_R2").as_deref() == Ok("true") {
                  let account = env::var("PLUMIVOX_R2_ACCOUNT_ID")?;
                  let bucket = env::var("PLUMIVOX_R2_BUCKET")?;
                  if account.len() != 32 || !account.bytes().all(|b| b.is_ascii_hexdigit())
                      || !(3..=63).contains(&bucket.len())
                      || !bucket.bytes().all(|b| b.is_ascii_lowercase() || b.is_ascii_digit() || b == b'-')
                      || bucket.starts_with('-') || bucket.ends_with('-')
                      || env::var("R2_CREDENTIALS_CONFIGURED").as_deref() != Ok("true") {
                      return Err("Configure R2 repository variables and secrets".into());
                  }
              }
              let exact = env::var("CHECKOUT_MODE").as_deref() == Ok("exact");
              let reference = if exact {
                  let sha = env::var("CHECKOUT_SHA")?;
                  if sha.len() != 40 || !sha.bytes().all(|b| b.is_ascii_digit() || (b'a'..=b'f').contains(&b)) {
                      return Err("Invalid checkout SHA".into());
                  }
                  sha
              } else {
                  let branch = env::var("DEFAULT_BRANCH")?;
                  if branch.is_empty() { return Err("Missing default branch".into()); }
                  let reference = format!("refs/heads/{branch}");
                  run(&["check-ref-format", &reference])?;
                  reference
              };
              run(&["init", "."])?;
              run(&["remote", "add", "origin", "https://github.com/1llum1n4t1s/Plumivox.git"])?;
              run(&["fetch", "--no-tags", "--depth=1", "origin", &reference])?;
              run(&["checkout", "--detach", "FETCH_HEAD"])?;
              if exact {
                  let head = Command::new("git").args(["rev-parse", "HEAD"]).output()?;
                  if !head.status.success() || String::from_utf8(head.stdout)?.trim() != reference {
                      return Err("Checkout SHA mismatch".into());
                  }
              }
              Ok(())
          }
      - name: Check out trusted workflow source
        shell: rustup run stable ./plumivox-ci-bootstrap.exe {0}
        env:
          CHECKOUT_MODE: exact
          CHECKOUT_SHA: ${{ github.sha }}
          CHECK_R2: 'true'
          PLUMIVOX_R2_ACCOUNT_ID: ${{ vars.PLUMIVOX_R2_ACCOUNT_ID }}
          PLUMIVOX_R2_BUCKET: ${{ vars.PLUMIVOX_R2_BUCKET }}
          R2_CREDENTIALS_CONFIGURED: ${{ secrets.PLUMIVOX_R2_ACCESS_KEY_ID != '' && secrets.PLUMIVOX_R2_SECRET_ACCESS_KEY != '' }}
        run: checkout
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install distribution targets
        run: cargo xtask ci-install-targets
      - name: Prepare dedicated macOS test Keychain
        if: runner.os == 'macOS'
        run: cargo xtask ci-keychain-prepare
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check sources and development tools
        if: runner.os != 'Linux'
        run: cargo xtask check
      - name: Run native and setup E2E tests
        if: runner.os != 'Linux'
        run: cargo xtask test-e2e
      - name: Update Linux package index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install real SSH validation tools
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes openssh-server
      - name: Run VPS installer unit, CLI, and real sshd tests
        if: runner.os == 'Linux'
        run: cargo xtask ci-vps-test
      - name: Clean up and verify dedicated macOS test Keychain
        if: always() && runner.os == 'macOS' && env.PLUMIVOX_TEST_KEYCHAIN != ''
        shell: rustup run stable ./plumivox-ci-cleanup.exe ci-keychain-cleanup {0}
        run: cleanup
      - name: Build distribution executable without test fixtures
        run: cargo xtask ci-distribution-build
      - name: Upload immutable artifacts to R2
        env:
          PLUMIVOX_R2_ACCOUNT_ID: ${{ vars.PLUMIVOX_R2_ACCOUNT_ID }}
          PLUMIVOX_R2_BUCKET: ${{ vars.PLUMIVOX_R2_BUCKET }}
          PLUMIVOX_R2_ACCESS_KEY_ID: ${{ secrets.PLUMIVOX_R2_ACCESS_KEY_ID }}
          PLUMIVOX_R2_SECRET_ACCESS_KEY: ${{ secrets.PLUMIVOX_R2_SECRET_ACCESS_KEY }}
        run: cargo xtask ci-artifact-upload
