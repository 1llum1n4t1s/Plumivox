name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out workflow commit
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid checkout SHA' >&2; exit 1; }
          git init .
          git remote add origin https://github.com/1llum1n4t1s/Plumivox.git
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$CHECKOUT_SHA" ]]
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Install locked dependencies
        run: cargo fetch --locked
      - name: Validate 1
        run: cargo xtask build
      - name: Validate 2
        run: cargo xtask check
      - name: Validate 3
        run: cargo xtask test-e2e
