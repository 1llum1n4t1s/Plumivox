name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Dependency validation"]
    types: [completed]
  check_run:
    types: [completed]
  status:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      github.repository_owner == '1llum1n4t1s' &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.user.id == 49699333) &&
      (github.event_name != 'status' || github.event.state == 'success') &&
      (github.event_name != 'check_run' || github.event.check_run.app.slug != 'github-actions')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 信頼済み既定ブランチのみを取得し、PRのコードは実行しない。
      - name: Check out trusted default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ -n "$DEFAULT_BRANCH" ]] || { echo 'Missing default branch' >&2; exit 1; }
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          git init .
          git remote add origin https://github.com/1llum1n4t1s/Plumivox.git
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          git checkout --detach FETCH_HEAD
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Verify CI and merge Dependabot updates
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
          GH_TOKEN: ${{ github.token }}
          REQUIRED_WORKFLOWS: '[".github/workflows/dependency-validation.yml"]'
        run: cargo xtask dependabot-auto-merge
